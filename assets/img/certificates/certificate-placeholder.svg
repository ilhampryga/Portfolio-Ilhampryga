<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title description">
  <title id="title">Certificate image placeholder</title>
  <desc id="description">Placeholder yang dapat diganti dengan gambar sertifikat asli.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc" />
      <stop offset="0.5" stop-color="#eef6f7" />
      <stop offset="1" stop-color="#e8efff" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f766e" />
      <stop offset="1" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>
  <rect width="1200" height="750" fill="url(#background)" />
  <circle cx="108" cy="112" r="180" fill="#2563eb" opacity="0.08" />
  <circle cx="1090" cy="650" r="220" fill="#0f766e" opacity="0.1" />
  <rect x="118" y="92" width="964" height="566" rx="28" fill="#fff" stroke="#cbd5e1" stroke-width="3" filter="url(#shadow)" />
  <rect x="144" y="118" width="912" height="514" rx="18" fill="none" stroke="url(#accent)" stroke-width="4" />
  <path d="M600 190l38 21 43 1-21 38-1 43-38-21-43-1 21-38 1-43Z" fill="url(#accent)" opacity="0.92" />
  <path d="m586 238 12 12 23-28" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
  <text x="600" y="360" fill="#0f172a" font-family="Arial, sans-serif" font-size="54" font-weight="700" text-anchor="middle">CERTIFICATE PREVIEW</text>
  <text x="600" y="418" fill="#64748b" font-family="Arial, sans-serif" font-size="26" text-anchor="middle">Replace this image with your certificate</text>
  <rect x="408" y="482" width="384" height="8" rx="4" fill="url(#accent)" opacity="0.82" />
  <rect x="476" y="520" width="248" height="6" rx="3" fill="#cbd5e1" />
</svg>
